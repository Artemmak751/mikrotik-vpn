name: Build MikroTik IP list

on:
  push:
    paths:
      - 'seed.rsc'
      - 'ips.txt'
      - 'build.py'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ips.rsc
        run: python build.py

      - name: Commit ips.rsc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ips.rsc
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Auto: update ips.rsc"
            git push
          fi
